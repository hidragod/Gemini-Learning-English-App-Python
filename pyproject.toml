[project]
name = "web-crawler-gemini"
version = "0.1.0"
description = "Web Crawler + Gemini Web + English Learning - PySide6 App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "browserforge>=1.2.4",
    "curl-cffi>=0.14.0",
    "gtts>=2.5.4",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "playwright>=1.58.0",
    "pygame>=2.6.1",
    "pyside6>=6.10.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scrapling>=0.4.2",
]

[project.scripts]
app = "main:main"
mcp-server = "run_mcp_server:main"
