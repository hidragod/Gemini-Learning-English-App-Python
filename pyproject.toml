[project]
name = "gemini-learning-english-app-python"
version = "0.1.0"
description = "Gemini Web + English Learning desktop app built with PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gtts>=2.5.4",
    "playwright>=1.58.0",
    "pygame>=2.6.1",
    "pyside6>=6.10.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
]

[project.scripts]
app = "main:main"
